  for (const n of G) rows[layer[n.path]].push(n.path);
  // canvas as wide as the widest row needs, capped so big graphs wrap rows instead
  const widest = Math.max(...rows.map(r => r.reduce((a, p) => a + W(p) + GAP, 0)));
  const MAXW = Math.min(Math.max(1100, Math.min(2400, Math.sqrt(G.length) * 260)), Math.max(480, PADX * 2 + widest));
  rows.forEach(r => r.sort());
  const place = () => {
    let y = 20; const bands = [];
    for (let i = nL - 1; i >= 0; i--) {
      const lines = [[]]; let x = PADX;
      for (const p of rows[i]) { const w = W(p); if (x + w > MAXW && lines.at(-1).length) { lines.push([]); x = PADX; } lines.at(-1).push(p); x += w + GAP; }
      const y0 = y;
      for (const ln of lines) {
        const tw = ln.reduce((a, p) => a + W(p), 0) + GAP * (ln.length - 1);
        let x = PADX + Math.max(0, (MAXW - PADX - tw) / 2);
        for (const p of ln) { const w = W(p); pos[p] = {x, y, w, cx: x + w / 2}; x += w + GAP; }
        y += LINEH;
      }
      bands.push({i, y0, y1: y - LINEH + BOXH}); y += BANDGAP;
    }
    return {bands, height: y - BANDGAP + 20};
  };
  // order each layer by barycentre of its neighbours; a few sweeps
  let lay = place();
  for (let pass = 0; pass < 4; pass++) {
    const bary = p => { const n = [...byId[p].imports, ...byId[p].usedBy].filter(x => pos[x]); return n.length ? n.reduce((a, x) => a + pos[x].cx, 0) / n.length : pos[p].cx; };
    for (const r of rows) { const b = Object.fromEntries(r.map(p => [p, bary(p)])); r.sort((a, c) => b[a] - b[c]); }
    lay = place();
  }
  width = MAXW + 20; height = lay.height;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  let bg = "", edges = "", nodes = "";
  for (const b of lay.bands) bg += `<rect class="bandbg" x="0" y="${b.y0 - 10}" width="${width}" height="${b.y1 - b.y0 + 20}"/>` +
    `<text class="band" x="10" y="${b.y0 + 5}">${b.i === 0 ? "foundation" : "layer " + b.i}</text>`;
  for (const n of G) for (const t of n.imports) {
    const a = pos[n.path], b = pos[t]; if (!b) continue;
    let d;
    if (a.y === b.y) { const ry = a.y - 18 - Math.min(40, Math.abs(a.cx - b.cx) / 6); d = `M${a.cx},${a.y} C${a.cx},${ry} ${b.cx},${ry} ${b.cx},${b.y}`; }
    else if (b.y > a.y) { const y1 = a.y + BOXH, my = (y1 + b.y) / 2; d = `M${a.cx},${y1} C${a.cx},${my} ${b.cx},${my} ${b.cx},${b.y}`; }
    else { const y2 = b.y + BOXH, my = (a.y + y2) / 2; d = `M${a.cx},${a.y} C${a.cx},${my} ${b.cx},${my} ${b.cx},${y2}`; }
    edges += `<path class="edge${inCycle(n.path, t) ? " cyc" : ""}" data-f="${esc(n.path)}" data-t="${esc(t)}" d="${d}"><title>${esc(n.path)} → ${esc(t)} (${n.weights[t] || 1} imports)</title></path>`;
  }
  for (const n of G) {
    const q = pos[n.path], c = color(n.ck);
    nodes += `<g class="node" tabindex="0" role="button" data-p="${esc(n.path)}">
      <rect class="box" x="${q.x}" y="${q.y}" width="${q.w}" height="${BOXH}" rx="6" style="stroke:${c}"/>
      <rect x="${q.x}" y="${q.y}" width="5" height="${BOXH}" rx="2" style="fill:${c}"/>
      <text x="${q.cx + 2}" y="${q.y + 18}" text-anchor="middle">${esc(label(n.path))}</text>
      <title>${esc(n.path)}${n.sub ? " (" + esc(n.sub) + ")" : ""}\n${n.nfiles} files · ${n.nfn} functions · ${num(n.lines)} lines\nimports ${n.imports.length} · imported by ${n.usedBy.length}</title></g>`;
  }
  svg.innerHTML = bg + `<g id="content"><g>${edges}</g><g>${nodes}</g></g>`;
  // size the canvas to what was actually drawn: same-row cycle arcs bulge above their row
  const bb = $("content").getBBox(), M = 12;
  const x0 = Math.min(0, bb.x - M), y0 = Math.min(0, bb.y - M);
  width = Math.max(width, bb.x + bb.width + M) - x0; height = Math.max(height, bb.y + bb.height + M) - y0;
  svg.setAttribute("viewBox", `${x0} ${y0} ${width} ${height}`);
  svg.querySelectorAll(".bandbg").forEach(r => { r.setAttribute("x", x0); r.setAttribute("width", width); });
  setZoom(Math.max(fitW(), .55));
}

// zoom
let zoom = 1;
// Fit = whole map visible: limited by the panel's width and by its max height (78vh)
const fitW = () => Math.min(1, ($("wrap").clientWidth - 2) / width);
const fit = () => Math.min(fitW(), (innerHeight * .78 - 2) / height);
const setZoom = z => { zoom = Math.max(.2, Math.min(3, z)); svg.style.width = width * zoom + "px"; svg.style.height = height * zoom + "px"; };
$("zin").onclick = () => setZoom(zoom * 1.25); $("zout").onclick = () => setZoom(zoom / 1.25); $("zfit").onclick = () => setZoom(fit());

// highlight a set of map nodes and the lines in and out of it
function highlight(set, title) {
  const near = new Set(set);
  for (const x of set) for (const y of [...(byId[x]?.imports || []), ...(byId[x]?.usedBy || [])]) near.add(y);
  svg.querySelectorAll(".node").forEach(n => { n.classList.toggle("on", set.has(n.dataset.p)); n.classList.toggle("dim", set.size > 0 && !near.has(n.dataset.p)); });
  svg.querySelectorAll(".edge").forEach(e => {
    const o = set.has(e.dataset.f) && !set.has(e.dataset.t), i = set.has(e.dataset.t) && !set.has(e.dataset.f), inner = set.has(e.dataset.f) && set.has(e.dataset.t);
    e.classList.toggle("out", o); e.classList.toggle("in", i); e.classList.toggle("dim", set.size > 0 && !o && !i && !inner);
  });
  if (set.size === 1) {
    const p = [...set][0], k = byId[p], cyc = sccs[sccOf[p]].length > 1, noun = NOUN[mode];
    $("hint").innerHTML = `<b>${esc(p)}</b> <span class="o">imports ${k.imports.length}</span> and <span class="i">is imported by ${k.usedBy.length}</span> ${noun}` +
      (cyc ? ` · <span class="c">in a cycle with ${sccs[sccOf[p]].length - 1} other ${noun.slice(0, -1)}(s)</span>` : "") + ".";
  } else if (title) $("hint").innerHTML = title;
  const first = svg.querySelector(".node.on");
  first?.scrollIntoView({block: "nearest", inline: "center", behavior: "smooth"});
}
svg.addEventListener("click", e => { const n = e.target.closest(".node"); if (n) mode === "pkg" ? selectPkg(n.dataset.p) : selectDir(n.dataset.p); });
svg.addEventListener("keydown", e => { const n = e.target.closest(".node"); if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.dispatchEvent(new MouseEvent("click", {bubbles: true})); } });
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { drawMap(b.dataset.mode); sel.pkg ? selectPkg(sel.pkg) : selectDir(sel.dir); });

// ---- browser: packages → files (modules) of the package → functions
// sel is {pkg: name} from the list, or {dir: folder} from a click on the map
let sel = {pkg: [...K].sort((a, b) => b.usedBy.length - a.usedBy.length || b.nfn - a.nfn)[0].name}, curFile = "", query = "", expOnly = false;
const maxLen = Math.min(200, Math.max(1, ...ALLF.flatMap(f => f.funcs.map(x => x.s))));
const pkgColor = k => color(k.dir === "." ? "." : k.dir);
const link = (file, line) => {
  const gh = D.source ? `<a href="${esc(D.source + file.rel)}#L${line}" target="_blank" rel="noopener">github</a> · ` : "";
  return D.local ? gh + `<a href="vscode://file${esc(encodeURI(D.root + "/" + file.rel))}:${line}">open</a>` : gh.replace(/ · $/, "");
};
const fname = f => sel.dir && new Set(curFiles().map(x => x.pk)).size > 1 ? f.pk + " · " + f.name : f.name;
const curFiles = () => sel.pkg ? byName[sel.pkg].files : ALLF.filter(f => f.g === sel.dir);
const fnRow = (f, file, where) => `<div class="fn">
  <div class="sig">${f.r ? `<span class="r">${esc(f.r)}.</span>` : ""}<span class="${f.e ? "x" : ""}">${esc(f.n)}</span>${where ? ` <span class="w">· ${esc(file.pk)} · ${esc(file.name)}</span>` : ""}</div>
  <div class="meta">:${f.l} · ${f.s} lines · ${link(file, f.l)}</div>
  ${f.d ? `<div class="doc">${esc(f.d)}</div>` : ""}
  <div class="bar" style="width:${Math.min(100, Math.max(1, 100 * f.s / maxLen))}%"></div></div>`;
function renderPkgs() {
  const lit = k => sel.pkg ? k.name === sel.pkg : k.dirs.has(sel.dir);
  $("pkgs").innerHTML = `<div class="colhead">Packages, most functions first</div>` + [...K].sort((a, b) => b.nfn - a.nfn).map(k =>
    `<button class="item${lit(k) ? " on" : ""}" data-pkg="${esc(k.name)}" title="${esc(k.dir)}"><span class="dot" style="background:${pkgColor(k)}"></span>
      <span class="n">${esc(k.name)}</span><span class="c">${k.nfn}</span></button>`).join("");
}
function renderFiles() {
  const list = (l, attr) => l.length ? l.map(x => `<a ${attr}="${esc(x)}">${esc(x)}</a>`).join(", ") : "—";
  const fl = curFiles(), nfn = fl.reduce((a, f) => a + f.funcs.length, 0);
  let head;
  if (sel.pkg) {
    const k = byName[sel.pkg];
    head = `<div class="colhead">package · ${esc(k.dir)}</div><div class="pdoc"><b>${esc(k.name)}</b>
      <div>Uses packages: ${list(k.imports, "data-gopkg")}</div><div>Used by: ${list(k.usedBy, "data-gopkg")}</div>
      ${k.ext.length ? `<details><summary>${k.ext.length} npm dependencies</summary><code>${k.ext.map(esc).join(", ")}</code></details>` : ""}</div>`;
  } else {
    const d = byPath[sel.dir], inPk = K.filter(k => k.dirs.has(sel.dir)).map(k => k.name);
    head = `<div class="colhead">folder on the map</div><div class="pdoc"><b>${esc(sel.dir)}</b>
      <div>In package: ${list(inPk, "data-gopkg")}</div>
      <div>Imports folders: ${list(d.imports, "data-go")}</div><div>Imported by: ${list(d.usedBy, "data-go")}</div></div>`;
  }
  $("files").innerHTML = head + `<button class="item${curFile === "" ? " on" : ""}" data-file=""><span class="n">all ${fl.length} files</span><span class="c">${nfn}</span></button>` +
    fl.map(f => `<button class="item${f.rel === curFile ? " on" : ""}" data-file="${esc(f.rel)}" title="${esc(f.rel)}"><span class="n">${esc(fname(f))}</span><span class="c">${f.funcs.length}</span></button>`).join("");
}
function renderFns() {
  let out = "", n = 0;
  const ok = f => (!expOnly || f.e) && (!query || (f.n + " " + (f.r || "") + " " + (f.d || "")).toLowerCase().includes(query));
  if (query) {
    for (const file of ALLF) for (const f of file.funcs) if (ok(f) && n < 300) { out += fnRow(f, file, true); n++; }
    $("fns").innerHTML = `<div class="colhead">Matching “${esc(query)}” everywhere${n >= 300 ? " (first 300)" : ""}</div>` + (out || `<div class="empty">No match.</div>`);
    return;
  }
  for (const file of curFiles()) {
    if (curFile && file.rel !== curFile) continue;
    const fs = file.funcs.filter(ok); if (!fs.length) continue;
    if (!curFile) out += `<div class="colhead" style="position:static">${esc(fname(file))} · ${num(file.lines)} lines</div>`;
    out += fs.map(f => fnRow(f, file, false)).join(""); n += fs.length;
  }
  $("fns").innerHTML = (curFile ? `<div class="colhead">${esc(curFile)} · ${n} functions</div>` : "") + (out || `<div class="empty">No functions here${expOnly ? " that are exported" : ""}.</div>`);
}
const renderAll = () => { renderPkgs(); renderFiles(); renderFns(); $("files").scrollTop = 0; $("fns").scrollTop = 0; };
function selectPkg(name) {
  sel = {pkg: name}; curFile = ""; renderAll();
  const k = byName[name];
  if (mode === "pkg") highlight(new Set([name]));
  else highlight(k.dirs, `Package <b>${esc(name)}</b> spans ${k.dirs.size} folder(s); <span class="o">orange</span> lines leave it, <span class="i">blue</span> lines come in.`);
}
function selectDir(p) {
  sel = {dir: p}; curFile = ""; renderAll();
  if (mode === "dir") highlight(new Set([p]));
  else highlight(new Set(K.filter(k => k.dirs.has(p)).map(k => k.name)), `Folder <b>${esc(p)}</b> is in the highlighted package.`);
}
$("pkgs").addEventListener("click", e => { const b = e.target.closest("[data-pkg]"); if (b) selectPkg(b.dataset.pkg); });
$("files").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return selectDir(g.dataset.go);
  const k = e.target.closest("[data-gopkg]"); if (k) return selectPkg(k.dataset.gopkg);
  const b = e.target.closest("[data-file]"); if (b) { curFile = b.dataset.file; renderFiles(); renderFns(); }
});
$("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderFns(); });
$("exported").addEventListener("change", e => { expOnly = e.target.checked; renderFns(); });
$("foot").textContent = `${D.rev ? "Commit " + D.rev + ". " : ""}Packages are folders with a package.json or project.json (Nx). Bold = exported. Type-only imports and tests are left out. “open” jumps to the line in VS Code${D.source ? "; “github” opens it on GitHub" : ""}.`;
drawMap(mode);
selectPkg(sel.pkg);
</script>
</body>
</html>
