<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Code map not found</title>
<script>
// /<site>/<owner>/<repo>... with no map yet -> home page, searching for it (and offering to request it)
// a project site lives under /<repo name>/ on <owner>.github.io and on a custom domain alike
const BASE = "/codemap/";
const path = location.pathname.startsWith(BASE) ? location.pathname.slice(BASE.length) : location.pathname.slice(1);
const q = path.replace(/\/?(index\.html)?$/, "");
location.replace(BASE + (q ? "?q=" + encodeURIComponent(q) : ""));
</script></head>
<body style="font-family:system-ui;background:#f6f5f1">Not found. <a href="./">See all code maps</a>.</body></html>
